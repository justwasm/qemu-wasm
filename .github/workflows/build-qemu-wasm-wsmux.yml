name: build-qemu-wasm-wsmux

on:
  push:
    branches: [wsmux-netdev, master]
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: shallow
      - uses: docker/setup-buildx-action@v3
      - name: Stage source for in-container build
        run: |
            # Use the same rw-clone trick as release-qemu-wasm-wsmux.yml:
            # the qemu source tree needs to be writable inside the
            # container so wrap-git subprojects can be cloned. The
            # read-only bind mount used in earlier iterations kept
            # tripping meson's "cannot mkdir ...: Read-only file system"
            # error from git clone into subprojects/<dir>.
            rm -rf /tmp/qemu-src
            git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
              "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/qemu-src
            cd /tmp/qemu-src
            git submodule update --init --depth 1 roms/edk2 dtc 2>/dev/null || true
      - name: Build qemu-system-x86_64.wasm (with wsmux netdev)
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -x
          docker build -t qemu-wasm-builder:local - < Dockerfile
          docker run --rm \
            -v /tmp/qemu-src:/work:rw \
            qemu-wasm-builder:local \
            bash -c '
              set -euo pipefail
              cd /work
              EXTRA_CFLAGS="-O3 -g -Wno-error=unused-command-line-argument -matomics -mbulk-memory -DNDEBUG -DG_DISABLE_ASSERT -D_GNU_SOURCE -sASYNCIFY=1 -pthread -sPROXY_TO_PTHREAD=1 -sFORCE_FILESYSTEM -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc --js-library=/build/node_modules/xterm-pty/emscripten-pty.js -sASYNCIFY_IMPORTS=ffi_call_js"
              # Remove edk2 (qemu-wasm subhook submodule is unreachable).
              rm -rf subprojects/edk2
              # Run configure + make. Meson will fetch every wrap-git
              # subproject from gitlab inside the container; release
              # workflow uses this same approach successfully.
              emconfigure /work/configure --static --target-list=x86_64-softmmu --cpu=wasm32 --cross-prefix= \
                --without-default-features --enable-system --with-coroutine=fiber --enable-virtfs \
                --extra-cflags="$EXTRA_CFLAGS" --extra-cxxflags="$EXTRA_CFLAGS" --extra-ldflags="-sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,TTY,FS"
              emmake make -j"$(nproc)" qemu-system-x86_64
              mkdir -p /work/out
              cp /build/qemu-system-x86_64.wasm /work/out/
              cp /build/qemu-system-x86_64 /work/out/out.js
              cp /build/qemu-system-x86_64.worker.js /work/out/
              ls -la /work/out
            '
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-system-x86_64-wsmux
          path: /tmp/qemu-src/out
          if-no-files-found: error