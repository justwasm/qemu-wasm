name: build-wasm
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "/opt/hostedtoolcache/CodeQL" || true
          df -h /
      - name: Build emsdk + deps image
        run: docker build -t buildqemu - < Dockerfile
      - name: Configure + make qemu-system-x86_64.wasm (with PTHREAD_POOL_SIZE fix)
        run: |
          set -x
          docker run --rm -d --name qwbuild -v "$PWD":/qemu/ buildqemu
          EXTRA_CFLAGS="-O3 -g -Wno-error=unused-command-line-argument -matomics -mbulk-memory -DNDEBUG -DG_DISABLE_ASSERT -D_GNU_SOURCE -sASYNCIFY=1 -pthread -sPROXY_TO_PTHREAD=1 -sPTHREAD_POOL_SIZE=8 -sFORCE_FILESYSTEM -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc --js-library=/build/node_modules/xterm-pty/emscripten-pty.js -sASYNCIFY_IMPORTS=ffi_call_js"
          docker exec qwbuild emconfigure /qemu/configure --static --target-list=x86_64-softmmu --cpu=wasm32 --cross-prefix= --without-default-features --enable-system --with-coroutine=fiber --enable-virtfs --extra-cflags="$EXTRA_CFLAGS" --extra-cxxflags="$EXTRA_CFLAGS" --extra-ldflags="-sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,TTY,FS"
          docker exec qwbuild emmake make -j"$(nproc)" qemu-system-x86_64
          mkdir -p out
          docker cp qwbuild:/build/qemu-system-x86_64.wasm out/
          docker cp qwbuild:/build/qemu-system-x86_64 out/out.js
          docker cp qwbuild:/build/qemu-system-x86_64.worker.js out/
          docker kill qwbuild || true
          ls -la out
      - name: Stage release artifacts
        run: |
          mkdir -p release
          mv out/qemu-system-x86_64.wasm release/qemu-system-x86_64.wasm
          mv out/out.js release/qemu-system-x86_64.out.js
          mv out/qemu-system-x86_64.worker.js release/qemu-system-x86_64.worker.js
          cd release
          sha256sum qemu-system-x86_64.wasm qemu-system-x86_64.out.js qemu-system-x86_64.worker.js > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-wasm-x86_64-worker
          path: release/
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --title "QEMU Wasm $release_tag"
          fi
          gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" --clobber release/*
