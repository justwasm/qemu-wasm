name: build-qemu-wasm-builder

on:
  push:
    paths:
      - Dockerfile
      - .github/workflows/build-qemu-wasm-builder.yml
    branches: [master, wsmux-netdev]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          TAGS="type=sha"
          if [ "$BRANCH" = "master" ] || [ "$BRANCH" = "main" ]; then
            TAGS="$TAGS
            type=ref,event=branch,format=short
            type=raw,value=latest"
          elif [ "$BRANCH" = "wsmux-netdev" ]; then
            TAGS="$TAGS
            type=raw,value=wsmux-netdev"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/justwasm/qemu-wasm-builder
          tags: ${{ steps.tags.outputs.tags }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/justwasm/qemu-wasm-builder:buildcache
          cache-to: type=registry,ref=ghcr.io/justwasm/qemu-wasm-builder:buildcache,mode=max
